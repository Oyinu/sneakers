<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <!-- Basic Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
<!-- Filled Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/filled/boxicons-filled.min.css" rel="stylesheet">
<!-- Brand Icons -->
<link href="https://cdn.boxicons.com/3.0.8/fonts/brands/boxicons-brands.min.css" rel="stylesheet">
  <title>Frontend Mentor | E-commerce product page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
<link rel="stylesheet" href="./style.css">
</head>
<body>

<nav>
<div class="left-side">
  <div class="logo">
<img src="./images/logo.svg" alt="Sneaker Company Logo">
</div>
<div class="nav-links">
  <ul>
    <li><a href="">Collections</a></li>
    <li><a href="">Men</a></li>     
      <li><a href="">Women</a></li>
      <li><a href="">About</a></li>
      <li><a href="">Contact</a></li>
  </ul>
</div>
</div>

<div class="right-side">
<img src="./images/icon-cart.svg" alt="Shopping Cart Icon" class="cart">
<img src="./images/image-avatar.png" alt="User Avatar" class="avatar">
</div>

</nav>
<hr>
<section>
  <div class="image-details">
    <div class="first-image">
<img src="./images/image-product-1.jpg" alt="Product Image" class="product-image">
    </div>
    

    <div>
      <div class="thumbnails">
        <img src="./images/image-product-1-thumbnail.jpg" alt="Thumbnail 1" class="thumbnail">
        <img src="./images/image-product-2-thumbnail.jpg" alt="Thumbnail 2" class="thumbnail">
        <img src="./images/image-product-3-thumbnail.jpg" alt="Thumbnail 3" class="thumbnail">
        <img src="./images/image-product-4-thumbnail.jpg" alt="Thumbnail 4" class="thumbnail">
      </div>
    </div>
  </div>
  <div class="text-details">
 <h2 class="sneaker"> Sneaker Company</h2>

 <h1 class="first-header"> Fall Limited Edition Sneakers</h1>

  <p class="texts">These low-profile sneakers are your perfect casual wear companion. Featuring a 
  durable rubber outer sole, they’ll withstand everything the weather can offer.
</p>
<div class="prices">
 <h2 class="first-price"> $125.00</h2>
  <p class="promo">50%</p>
</div>
<h3 class="old-price">  $250.00</h3>

<div class="buy">
  <div class="quantity">
  <button>
    <img src="./images/icon-minus.svg" alt="Minus Icon">
    <p>0</p>
    <img src="./images/icon-plus.svg" alt="">
  </button>
  </div>
<button class="btn"> 
   <p> <i class="bx bx-cart-alt-2"></i>Add to cart</p>
</button>
</div>
 
  </div>
</section>

  <script src="/script.js"></script>
</body>
</html>
